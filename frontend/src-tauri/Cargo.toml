[package]
name = "audio-switch-panel"
version = "0.11.1"
description = "AudioSwitch desktop panel"
edition = "2021"
rust-version = "1.99"
license = "GPL-3.0-only"
default-run = "audio-switch-panel"

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = [] }
serde_json = "1"
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["net", "io-util", "time", "sync", "rt", "macros", "process"] }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_RemoteDesktop"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
